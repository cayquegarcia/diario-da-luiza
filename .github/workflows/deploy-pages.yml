name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar site estático
        run: npm run build
        env:
          NEXT_PUBLIC_ASSET_PREFIX: /diario-da-luiza
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Organizar arquivos para a URL do projeto
        run: |
          mkdir .pages-artifact
          cp -R dist/client/. .pages-artifact/
          cp -R dist/client/diario-da-luiza/_next .pages-artifact/_next
          rm -rf .pages-artifact/diario-da-luiza
      - name: Enviar site pronto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
